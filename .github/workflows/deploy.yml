name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The /releases page is rebuilt from the GitHub API, so the site also
  # rebuilds once a day and whenever another repository asks for it:
  #   gh api repos/EvilFlowersCatalog/EvilFlowersCatalog.github.io/dispatches \
  #     -f event_type=release-published
  schedule:
    - cron: '17 5 * * *'
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Refreshes src/data/releases.json. On an API error it keeps the
      # committed snapshot, so the build never fails because of GitHub.
      - run: npm run releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
