name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The /releases page is rebuilt from the GitHub API, so the site also
  # rebuilds once a day and whenever another repository asks for it:
  #   gh api repos/EvilFlowersCatalog/EvilFlowersCatalog.github.io/dispatches \
  #     -f event_type=release-published
  # EvilFlowersCatalog/deploy sends `deploy-updated` after each green push to
  # its main, so /deploy follows the generator within minutes.
  schedule:
    - cron: '17 5 * * *'
  repository_dispatch:
    types: [release-published, deploy-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      # /deploy builds its downloads from EvilFlowersCatalog/deploy (submodule at
      # packages/elvira-deploy). Use the head of its main, not the commit recorded
      # here, so the page always hands out what the repository has.
      - name: EvilFlowersCatalog/deploy at the head of main
        run: |
          git submodule update --remote --depth 1 packages/elvira-deploy
          git -C packages/elvira-deploy log -1 --format='EvilFlowersCatalog/deploy@%h %s'

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Copies the deploy repository's files into src/data/deploy-blocks.json, then
      # checks what /deploy assembles from them against the repository itself
      # (docker compose config, nginx -t, kubeconform). A change on deploy/main the
      # page cannot handle stops the build here.
      - run: npm run deploy-blocks
      - run: npm run check:deploy

      # Refreshes src/data/releases.json. On an API error it keeps the
      # committed snapshot, so the build never fails because of GitHub.
      - run: npm run releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
